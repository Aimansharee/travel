<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>شركة ترافل اكس — المساعد الذكي</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    /* ===== Reset & Base ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    /* ===== Chat Container ===== */
    .chat-container {
      width: 100%;
      max-width: 860px;
      height: 90vh;
      max-height: 780px;
      display: flex;
      flex-direction: column;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 30px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.06);
      background: #0d1117;
    }

    /* ===== Header ===== */
    .chat-header {
      background: linear-gradient(90deg, #1a73e8, #0d47a1);
      padding: 18px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }

    .header-logo {
      width: 48px;
      height: 48px;
      background: rgba(255,255,255,0.15);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      color: #fff;
      flex-shrink: 0;
      border: 2px solid rgba(255,255,255,0.3);
    }

    .header-info { flex: 1; }

    .header-title {
      font-size: 19px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.3px;
    }

    .header-subtitle {
      font-size: 13px;
      color: rgba(255,255,255,0.75);
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4caf50;
      display: inline-block;
      animation: pulse 2s infinite;
    }

    .status-dot.offline { background: #f44336; animation: none; }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.6; transform: scale(1.3); }
    }

    .header-actions { display: flex; gap: 10px; }

    .header-btn {
      background: rgba(255,255,255,0.12);
      border: none;
      border-radius: 10px;
      color: #fff;
      width: 38px;
      height: 38px;
      cursor: pointer;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .header-btn:hover { background: rgba(255,255,255,0.22); }

    /* ===== Messages Area ===== */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: #0d1117;
      scroll-behavior: smooth;
    }

    .chat-messages::-webkit-scrollbar { width: 5px; }
    .chat-messages::-webkit-scrollbar-track { background: transparent; }
    .chat-messages::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }

    /* ===== Date Separator ===== */
    .date-separator {
      text-align: center;
      color: #484f58;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .date-separator::before, .date-separator::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #21262d;
    }

    /* ===== Message Bubble ===== */
    .message-row {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      max-width: 78%;
      animation: fadeSlide 0.3s ease;
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .message-row.bot  { align-self: flex-start; flex-direction: row; }
    .message-row.user { align-self: flex-end;   flex-direction: row-reverse; }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .bot  .avatar { background: linear-gradient(135deg, #1a73e8, #0d47a1); color: #fff; }
    .user .avatar { background: linear-gradient(135deg, #00c9a7, #00796b); color: #fff; }

    .bubble {
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 16px;
      line-height: 1.6;
      max-width: 100%;
      word-break: break-word;
    }

    .bot  .bubble {
      background: #161b22;
      color: #e6edf3;
      border-bottom-right-radius: 18px;
      border-bottom-left-radius: 4px;
      border: 1px solid #21262d;
    }

    .user .bubble {
      background: linear-gradient(135deg, #1a73e8, #0d47a1);
      color: #fff;
      border-bottom-left-radius: 18px;
      border-bottom-right-radius: 4px;
    }

    .msg-time {
      font-size: 11px;
      color: #484f58;
      margin-top: 4px;
      text-align: end;
      padding: 0 4px;
    }

    .message-col { display: flex; flex-direction: column; }
    .user .message-col { align-items: flex-end; }
    .bot  .message-col { align-items: flex-start; }

    /* ===== Typing Indicator ===== */
    .typing-row {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      align-self: flex-start;
      animation: fadeSlide 0.3s ease;
    }

    .typing-bubble {
      background: #161b22;
      border: 1px solid #21262d;
      border-radius: 18px;
      border-bottom-left-radius: 4px;
      padding: 14px 18px;
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .typing-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #484f58;
      animation: typingBounce 1.2s infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0);   background: #484f58; }
      30%            { transform: translateY(-6px); background: #1a73e8; }
    }

    /* ===== Error Message ===== */
    .error-bubble {
      background: #1a0a0a;
      border: 1px solid #5a1a1a;
      color: #f48771;
      border-radius: 18px;
      border-bottom-left-radius: 4px;
      padding: 12px 16px;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ===== Input Area ===== */
    .chat-input-area {
      padding: 16px 20px;
      background: #161b22;
      border-top: 1px solid #21262d;
      flex-shrink: 0;
    }

    .input-wrapper {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: #0d1117;
      border: 1.5px solid #30363d;
      border-radius: 16px;
      padding: 10px 14px;
      transition: border-color 0.25s;
    }

    .input-wrapper:focus-within { border-color: #1a73e8; }

    #messageInput {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #e6edf3;
      font-size: 16px;
      font-family: inherit;
      resize: none;
      min-height: 24px;
      max-height: 120px;
      line-height: 1.5;
      direction: rtl;
    }

    #messageInput::placeholder { color: #484f58; }

    #sendBtn {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #1a73e8, #0d47a1);
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
    }

    #sendBtn:hover  { transform: scale(1.07); box-shadow: 0 4px 16px rgba(26,115,232,0.45); }
    #sendBtn:active { transform: scale(0.95); }
    #sendBtn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; box-shadow: none; }

    .input-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      font-size: 12px;
      color: #484f58;
      padding: 0 4px;
    }

    /* ===== Responsive ===== */
    @media (max-width: 600px) {
      body { padding: 0; align-items: stretch; }
      .chat-container { max-width: 100%; height: 100vh; max-height: 100vh; border-radius: 0; }
      .message-row { max-width: 90%; }
    }
  </style>
</head>
<body>

<div class="chat-container">

  <!-- Header -->
  <div class="chat-header">
    <div class="header-logo">
      <i class="fa-solid fa-plane-departure"></i>
    </div>
    <div class="header-info">
      <div class="header-title">ترافل اكس — المساعد الذكي</div>
      <div class="header-subtitle">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">متصل الآن</span>
      </div>
    </div>
    <div class="header-actions">
      <button class="header-btn" title="مسح المحادثة" onclick="clearChat()">
        <i class="fa-solid fa-rotate-right"></i>
      </button>
    </div>
  </div>

  <!-- Messages -->
  <div class="chat-messages" id="chatMessages">
    <div class="date-separator">اليوم</div>
  </div>

  <!-- Input -->
  <div class="chat-input-area">
    <div class="input-wrapper">
      <textarea
        id="messageInput"
        rows="1"
        placeholder="اكتب رسالتك هنا..."
        aria-label="حقل الرسالة"
      ></textarea>
      <button id="sendBtn" aria-label="إرسال">
        <i class="fa-solid fa-paper-plane"></i>
      </button>
    </div>
    <div class="input-footer">
      <span>اضغط <kbd>Enter</kbd> للإرسال</span>
      <span id="charCount">0 / 1000</span>
    </div>
  </div>

</div>

<script>
  /* ========================================================
     CONFIG
  ======================================================== */
  const WEBHOOK_URL = 'http://localhost:5678/webhook/c639af06-2b6f-4132-a783-bf62ee6d8de2';
  const MAX_CHARS    = 1000;

  /* ========================================================
     SESSION ID
  ======================================================== */
  function getSessionId() {
    let id = localStorage.getItem('travelx_session_id');
    if (!id) {
      id = 'sess_' + Date.now() + '_' + Math.random().toString(36).slice(2, 9);
      localStorage.setItem('travelx_session_id', id);
    }
    return id;
  }

  const sessionId = getSessionId();

  /* ========================================================
     DOM REFS
  ======================================================== */
  const messagesEl   = document.getElementById('chatMessages');
  const inputEl      = document.getElementById('messageInput');
  const sendBtn      = document.getElementById('sendBtn');
  const statusDot    = document.getElementById('statusDot');
  const statusText   = document.getElementById('statusText');
  const charCountEl  = document.getElementById('charCount');

  /* ========================================================
     HELPERS
  ======================================================== */
  function now() {
    return new Date().toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' });
  }

  function scrollToBottom() {
    messagesEl.scrollTo({ top: messagesEl.scrollHeight, behavior: 'smooth' });
  }

  function setStatus(online) {
    statusDot.className = 'status-dot' + (online ? '' : ' offline');
    statusText.textContent = online ? 'متصل الآن' : 'غير متصل';
  }

  /* ========================================================
     RENDER MESSAGES
  ======================================================== */
  function appendMessage(text, role) {
    const row = document.createElement('div');
    row.className = `message-row ${role}`;

    const avatarIcon = role === 'bot'
      ? '<i class="fa-solid fa-robot"></i>'
      : '<i class="fa-solid fa-user"></i>';

    const col = document.createElement('div');
    col.className = 'message-col';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;

    const time = document.createElement('div');
    time.className = 'msg-time';
    time.textContent = now();

    col.appendChild(bubble);
    col.appendChild(time);

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.innerHTML = avatarIcon;

    row.appendChild(avatar);
    row.appendChild(col);

    messagesEl.appendChild(row);
    scrollToBottom();
    return row;
  }

  function appendError(text) {
    const row = document.createElement('div');
    row.className = 'typing-row';

    const avatar = document.createElement('div');
    avatar.className = 'avatar bot';
    avatar.innerHTML = '<i class="fa-solid fa-robot"></i>';

    const bubble = document.createElement('div');
    bubble.className = 'error-bubble';
    bubble.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> ${text}`;

    row.appendChild(avatar);
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    scrollToBottom();
  }

  /* ========================================================
     TYPING INDICATOR
  ======================================================== */
  let typingEl = null;

  function showTyping() {
    typingEl = document.createElement('div');
    typingEl.className = 'typing-row';

    const avatar = document.createElement('div');
    avatar.className = 'avatar bot';
    avatar.innerHTML = '<i class="fa-solid fa-robot"></i>';

    const bubble = document.createElement('div');
    bubble.className = 'typing-bubble';
    bubble.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';

    typingEl.appendChild(avatar);
    typingEl.appendChild(bubble);
    messagesEl.appendChild(typingEl);
    scrollToBottom();
  }

  function hideTyping() {
    if (typingEl) { typingEl.remove(); typingEl = null; }
  }

  /* ========================================================
     SEND MESSAGE
  ======================================================== */
  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || sendBtn.disabled) return;

    // Disable input while waiting
    sendBtn.disabled = true;
    inputEl.disabled = true;
    inputEl.value = '';
    autoResize();
    charCountEl.textContent = `0 / ${MAX_CHARS}`;

    appendMessage(text, 'user');
    showTyping();

    try {
      const response = await fetch(WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, sessionId })
      });

      hideTyping();

      if (!response.ok) {
        appendError(`حدث خطأ من الخادم (${response.status}). يرجى المحاولة مجدداً.`);
        setStatus(false);
      } else {
        setStatus(true);
        const data = await response.json();

        // Support both "output" and "response" fields
        const reply = data?.output || data?.response || data?.text || data?.message;

        if (reply) {
          appendMessage(reply, 'bot');
        } else {
          appendError('استلمت رداً فارغاً من الخادم. تأكد من إعداد الـ workflow في n8n.');
        }
      }
    } catch (err) {
      hideTyping();
      setStatus(false);
      appendError('تعذّر الاتصال بالخادم. تحقق من تشغيل n8n وأن الـ webhook نشط.');
      console.error('[TravelX Chat]', err);
    } finally {
      sendBtn.disabled = false;
      inputEl.disabled = false;
      inputEl.focus();
    }
  }

  /* ========================================================
     CLEAR CHAT
  ======================================================== */
  function clearChat() {
    if (!confirm('هل تريد بدء محادثة جديدة؟ سيتم مسح السجل الحالي.')) return;
    localStorage.removeItem('travelx_session_id');
    location.reload();
  }

  /* ========================================================
     AUTO-RESIZE TEXTAREA
  ======================================================== */
  function autoResize() {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  }

  /* ========================================================
     EVENTS
  ======================================================== */
  inputEl.addEventListener('input', () => {
    autoResize();
    const len = inputEl.value.length;
    charCountEl.textContent = `${len} / ${MAX_CHARS}`;
    charCountEl.style.color = len > MAX_CHARS * 0.9 ? '#f48771' : '#484f58';
    if (inputEl.value.length > MAX_CHARS) {
      inputEl.value = inputEl.value.slice(0, MAX_CHARS);
    }
  });

  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  sendBtn.addEventListener('click', sendMessage);

  /* ========================================================
     WELCOME MESSAGE
  ======================================================== */
  window.addEventListener('DOMContentLoaded', () => {
    appendMessage(
      'أهلاً وسهلاً بك في ترافل اكس! 🌍✈️\nأنا مساعدك الذكي لتخطيط رحلاتك. كيف يمكنني مساعدتك اليوم؟',
      'bot'
    );
    inputEl.focus();
  });
</script>
</body>
</html>
